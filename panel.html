<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>yarosfactory — панель музики</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #16181c; color: #e6e6e6; padding: 14px; }
  h2 { font-size: 13px; color: #9aa0a8; margin: 18px 0 8px; }
  #status { font-size: 12px; color: #9aa0a8; margin-bottom: 10px; }
  #status.connected { color: #5fbf6f; }
  #status.disconnected { color: #d9534f; }

  #current {
    background: #1f2226;
    border: 1px solid #2b2f35;
    border-radius: 6px;
    padding: 10px 12px;
  }
  #current-top { display: flex; align-items: center; gap: 10px; }
  #platform-icon { width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; object-fit: cover; background: #2b2f35; }
  #platform-icon-wrap { position: relative; width: 22px; height: 22px; flex-shrink: 0; }
  #platform-icon-wrap.loading::before {
    content: ''; position: absolute; inset: -4px;
    border-radius: 50%; border: 2px solid transparent;
    border-top-color: #5b8cff; border-right-color: #5b8cff;
    animation: platform-icon-spin 0.8s linear infinite;
  }
  @keyframes platform-icon-spin { to { transform: rotate(360deg); } }
  #current-info { min-width: 0; flex: 1; }
  #cur-title { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cur-sub { font-size: 12px; color: #9aa0a8; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #playpause {
    width: 34px; height: 34px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: #2b2f35; border: 1px solid #383d44; border-radius: 50%;
    cursor: pointer;
  }
  #playpause:hover { background: #383d44; }
  #playpause svg { width: 15px; height: 15px; fill: #e6e6e6; }

  #progress-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  #progress-slider { flex: 1; height: 4px; accent-color: #5b8cff; cursor: pointer; }
  #time-label { font-size: 11px; color: #9aa0a8; white-space: nowrap; min-width: 78px; text-align: right; }

  #skip-btn {
    width: 34px; height: 34px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: #2b2f35; border: 1px solid #383d44; border-radius: 50%;
    cursor: pointer;
  }
  #skip-btn:hover { background: #383d44; }
  #skip-btn svg { width: 15px; height: 15px; fill: #e6e6e6; }

  #current-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  #quick-bans { display: flex; gap: 6px; }
  .quick-ban-btn {
    width: 26px; height: 26px; flex-shrink: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: #2b2f35; border: 1px solid #383d44; border-radius: 50%;
    color: #9aa0a8; cursor: pointer;
  }
  .quick-ban-btn:hover:not(:disabled) { background: #3a2626; border-color: #5a3535; color: #e07d7d; }
  .quick-ban-btn:disabled { opacity: 0.35; cursor: default; }
  .quick-ban-btn svg { width: 13px; height: 13px; }

  .bg-ctrl-btn {
    width: 26px; height: 26px; flex-shrink: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: #2b2f35; border: 1px solid #383d44; border-radius: 50%;
    color: #9aa0a8; cursor: pointer;
  }
  .bg-ctrl-btn:hover { background: #383d44; color: #e6e6e6; }
  .bg-ctrl-btn.danger:hover { background: #3a2626; border-color: #5a3535; color: #e07d7d; }
  .bg-ctrl-btn.on { background: #24344f; border-color: #3d5a8a; color: #7fa8ff; }
  .bg-ctrl-btn svg { width: 13px; height: 13px; }

  button { background: #2b2f35; color: #e6e6e6; border: 1px solid #383d44; border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  button:hover { background: #383d44; }

  #add-form { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  #add-form input { background: #1f2226; border: 1px solid #2b2f35; color: #e6e6e6; border-radius: 4px; padding: 6px 8px; font-size: 12px; }
  #add-form input[name="url"] { flex: 1; min-width: 200px; }
  #add-form input[name="requestedBy"] { width: 110px; }

  #queue { display: flex; flex-direction: column; gap: 6px; }
  .queue-item {
    position: relative;
    background: #1f2226; border: 1px solid #2b2f35; border-radius: 6px;
    padding: 8px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  }
  .queue-item-text { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .queue-item .info { min-width: 0; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queue-item .who { color: #9aa0a8; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; }
  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; padding: 1px 7px; border-radius: 10px; line-height: 1.6; white-space: nowrap; }
  .badge-sub { background: rgba(145, 70, 255, 0.18); color: #b794f6; }
  .badge-priority { background: rgba(255, 193, 7, 0.15); color: #ffca4a; }
  .badge-donation { background: rgba(56, 189, 120, 0.15); color: #4ade80; }
  .badge-icon { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  #empty { color: #6b7178; font-size: 12.5px; }

  #bg-playlists { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  #bg-empty { color: #6b7178; font-size: 12.5px; }
  .bg-playlist-item {
    background: #1f2226; border: 1px solid #2b2f35; border-radius: 6px;
    padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .bg-playlist-item.active { border-color: #5b8cff; }
  .bg-playlist-text { min-width: 0; flex: 1; }
  .bg-playlist-title { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bg-playlist-item.active .bg-playlist-title { color: #7fa8ff; }
  .bg-playlist-meta { font-size: 11px; color: #9aa0a8; margin-top: 2px; }
  .bg-playlist-controls { display: flex; gap: 4px; flex-shrink: 0; }
  #bg-playlist-form { display: flex; gap: 6px; margin-bottom: 12px; }
  #bg-playlist-form input { background: #1f2226; border: 1px solid #2b2f35; color: #e6e6e6; border-radius: 4px; padding: 6px 8px; font-size: 12px; flex: 1; }

  .kebab-btn {
    flex-shrink: 0; width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid transparent; border-radius: 5px;
    color: #9aa0a8; font-size: 16px; line-height: 1; padding: 0;
  }
  .kebab-btn:hover { background: #2b2f35; color: #e6e6e6; }

  .item-menu {
    display: none; flex-direction: column;
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 20;
    min-width: 190px;
    background: #23262b; border: 1px solid #2f3339; border-radius: 8px;
    padding: 4px; box-shadow: 0 6px 18px rgba(0,0,0,0.45);
  }
  .item-menu.open { display: flex; }
  .item-menu button {
    all: unset; box-sizing: border-box;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 9px; border-radius: 5px; cursor: pointer;
    font-size: 12.5px; color: #e6e6e6;
  }
  .item-menu button:hover { background: #2b2f35; }
  .item-menu button.danger { color: #e07d7d; }
  .item-menu .menu-icon { width: 14px; flex-shrink: 0; text-align: center; opacity: 0.9; }

  #bans { display: flex; flex-direction: column; gap: 10px; }
  .ban-group { font-size: 12.5px; }
  .ban-group .label { color: #9aa0a8; margin-bottom: 4px; }
  .ban-chip { display: inline-flex; align-items: center; gap: 6px; background: #2b2f35; border-radius: 12px; padding: 3px 8px 3px 10px; margin: 0 6px 6px 0; font-size: 12px; }
  .ban-chip button { padding: 0 4px; border: none; background: none; color: #e08b8b; font-size: 13px; }
</style>
</head>
<body>

<div id="status" class="disconnected">З'єднання...</div>

<h2>Поточний трек</h2>
<div id="current">
  <div id="current-top">
    <div id="platform-icon-wrap"><img id="platform-icon" alt=""></div>
    <div id="current-info">
      <div id="cur-title">Нічого не грає</div>
      <div id="cur-sub"></div>
    </div>
    <div id="playpause">
      <svg id="playpause-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
  </div>
  <div id="progress-row">
    <input type="range" id="progress-slider" min="0" max="1000" value="0">
    <div id="time-label">00:00 / 00:00</div>
  </div>
  <div id="current-actions">
    <button id="skip-btn" title="Наступний трек"><svg viewBox="0 0 24 24"><path d="M6 6l8 6-8 6zM16 6h2v12h-2z"/></svg></button>
    <div id="quick-bans">
      <button class="quick-ban-btn" id="qb-song" type="button" title="Забанити пісню">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 17V5l11-2v12"/><circle cx="6" cy="17" r="3"/><circle cx="17" cy="13" r="3"/>
        </svg>
      </button>
      <button class="quick-ban-btn" id="qb-artist" type="button" title="Забанити виконавця">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0014 0M12 17v4"/>
        </svg>
      </button>
      <button class="quick-ban-btn" id="qb-user" type="button" title="Забанити замовника">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.2"/><path d="M5 19c0-3.3 3.1-6 7-6s7 2.7 7 6"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<h2>Додати трек наступним (тільки для стрімера)</h2>
<form id="add-form">
  <input type="text" name="url" placeholder="Посилання (YouTube/SoundCloud/Spotify) або назва треку" required>
  <input type="text" name="requestedBy" placeholder="Хто замовив">
  <button type="submit">Додати наступним</button>
</form>

<h2>Черга (<span id="queue-count">0</span>)</h2>
<div id="queue"><div id="empty">Черга порожня.</div></div>

<h2>Фонові плейлисти</h2>
<div id="bg-playlists"><div id="bg-empty">Жодного плейлиста не додано.</div></div>
<form id="bg-playlist-form">
  <input type="text" name="url" placeholder="Посилання на YouTube-плейлист">
  <button type="submit">+</button>
</form>

<h2>Бан-листи</h2>
<div id="bans">
  <div class="ban-group"><div class="label">Заблоковані глядачі</div><div id="ban-users"></div></div>
  <div class="ban-group"><div class="label">Заблоковані виконавці</div><div id="ban-artists"></div></div>
  <div class="ban-group"><div class="label">Заблоковані посилання</div><div id="ban-songs"></div></div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const sbPort = params.get('sb') || 8080;
  const statusEl = document.getElementById('status');
  let ws;
  let lastPaused = false;
  let lastDuration = 0;
  let isSeeking = false;
  let currentKnownKey = null;       // identity of whatever track is currently shown as "current"
  let progressReceivedForKey = null; // set once a real progress tick has arrived for that track

  let currentTrack = null;

  // Іконки платформ — лежать у корені репозиторію yarosfactory-twitch/player.
  const PLATFORM_ICON_URLS = {
    youtube: 'https://raw.githubusercontent.com/yarosfactory-twitch/player/main/youtube.svg',
    'youtube-music': 'https://raw.githubusercontent.com/yarosfactory-twitch/player/main/youtube-music.svg',
    soundcloud: 'https://raw.githubusercontent.com/yarosfactory-twitch/player/main/soundcloud.svg',
    spotify: 'https://raw.githubusercontent.com/yarosfactory-twitch/player/main/spotify.svg',
    'apple-music': 'https://raw.githubusercontent.com/yarosfactory-twitch/player/main/apple-music.svg',
    default: 'https://raw.githubusercontent.com/yarosfactory-twitch/player/main/default.svg'
  };
  // Same repo as the platform icons above — upload donatello.svg there too.
  const DONATELLO_ICON_URL = 'https://raw.githubusercontent.com/yarosfactory-twitch/player/main/donatello.svg';
  const PRIORITY_LEVEL_DONATION = 8; // must match PRIORITY_LEVEL_DONATION in Music-Handle.cs
  const PLAY_ICON = '<path d="M8 5v14l11-7z"/>';
  const PAUSE_ICON = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  const SHUFFLE_ICON = '<path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/>';
  const LOOP_ICON = '<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/>';
  const REMOVE_ICON = '<line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/>';

  function connect() {
    ws = new WebSocket('ws://127.0.0.1:' + sbPort + '/');
    ws.onopen = () => {
      statusEl.textContent = 'Підключено до Streamer.bot';
      statusEl.className = 'connected';
      ws.send(JSON.stringify({ request: 'Subscribe', id: 'sub-panel', events: { General: ['Custom'] } }));
    };
    ws.onclose = () => { statusEl.textContent = "Немає з'єднання зі Streamer.bot — перепідключення..."; statusEl.className = 'disconnected'; setTimeout(connect, 2000); };
    ws.onerror = () => ws.close();
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (!msg.event || msg.event.source !== 'General' || msg.event.type !== 'Custom') return;
      if (msg.data.event === 'state') render(msg.data);
      else if (msg.data.event === 'progress') renderProgress(msg.data.position, msg.data.duration);
    };
  }

  function doAction(actionArgs) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ request: 'DoAction', id: 'panel-' + Date.now(), action: { name: 'Music - Handle' }, args: actionArgs }));
    }
  }

  function trackLabel(t) { return t.title || (t.source === 'youtube' ? t.videoId : t.trackUrl); }

  // Identifier used for remove / priority-play / ban-link actions.
  // Matches the Music - Handle track shape: YouTube tracks carry `youtubeUrl`,
  // SoundCloud tracks carry `trackUrl`.
  function trackUrl(t) { return t.youtubeUrl || t.trackUrl || ''; }

  function formatTime(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function render(state) {
    const cur = state.current;
    currentTrack = cur;
    lastPaused = !!state.paused;

    const curKey = cur ? (cur.id != null ? cur.id : trackLabel(cur)) : null;
    if (curKey !== currentKnownKey) {
      // the current track just changed (or playback stopped) — a freshly claimed
      // track hasn't reported real progress yet, so the spinner starts again;
      // renderProgress clears it once an actual position/duration tick arrives.
      currentKnownKey = curKey;
      progressReceivedForKey = null;
    }
    document.getElementById('platform-icon-wrap').classList.toggle('loading', !!cur && progressReceivedForKey !== curKey);

    document.getElementById('cur-title').textContent = cur ? trackLabel(cur) : 'Нічого не грає';
    document.getElementById('cur-sub').textContent = cur
      ? [cur.artist, cur.backgroundPlaylistTitle ? ('🔁 ' + cur.backgroundPlaylistTitle) : (cur.requestedBy ? ('замовив: ' + cur.requestedBy) : '')].filter(Boolean).join(' · ')
      : '';

    const iconImg = document.getElementById('platform-icon');
    const iconKey = cur ? (cur.originSource || cur.source) : null;
    iconImg.src = PLATFORM_ICON_URLS[iconKey] || PLATFORM_ICON_URLS.default;

    document.getElementById('playpause-icon').innerHTML = lastPaused ? PLAY_ICON : PAUSE_ICON;

    document.getElementById('qb-song').disabled = !cur || !cur.title;
    document.getElementById('qb-artist').disabled = !cur || !cur.artist;
    document.getElementById('qb-user').disabled = !cur || !cur.requestedBy;

    if (!cur) { renderProgress(0, 0); }

    const queueEl = document.getElementById('queue');
    document.getElementById('queue-count').textContent = state.queue.length;
    queueEl.innerHTML = '';
    if (state.queue.length === 0) {
      queueEl.innerHTML = '<div id="empty">Черга порожня.</div>';
    } else {
      state.queue.forEach((t, idx) => {
        const url = trackUrl(t);
        const badges = priorityBadgesHtml(t);
        const row = document.createElement('div');
        row.className = 'queue-item';
        row.innerHTML = `
          <div class="queue-item-text">
            <div class="info">${escapeHtml(trackLabel(t))}${t.artist ? ' — ' + escapeHtml(t.artist) : ''} <span class="who">${t.requestedBy ? '· ' + escapeHtml(t.requestedBy) : ''}</span></div>
            ${badges ? `<div class="badges">${badges}</div>` : ''}
          </div>
          <button class="kebab-btn" type="button" aria-label="Дії">⋮</button>
          <div class="item-menu" data-idx="${idx}">
            <button type="button" data-action="play-now" data-url="${escapeHtml(url)}">
              <span class="menu-icon">▶</span> Відтворити позачергово
            </button>
            <button type="button" class="danger" data-action="remove" data-url="${escapeHtml(url)}">
              <span class="menu-icon">✕</span> Вилучити з черги
            </button>
            <button type="button" data-action="ban-link" data-url="${escapeHtml(url)}">
              <span class="menu-icon">🚫</span> Забанити посилання
            </button>
            <button type="button" data-action="ban-user" data-value="${escapeHtml(t.requestedBy || '')}">
              <span class="menu-icon">🚫</span> Забанити замовника
            </button>
          </div>`;
        queueEl.appendChild(row);
      });
    }

    renderBanGroup('ban-users', state.bans.users, 'user');
    renderBanGroup('ban-artists', state.bans.artists, 'artist');
    renderBanGroup('ban-songs', state.bans.links, 'link');
    renderBackgroundPlaylists(state);
  }

  function formatDuration(seconds) {
    seconds = Math.round(Number(seconds) || 0);
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    const mm = String(m).padStart(h ? 2 : 1, '0');
    const ss = String(s).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2,'0')}:${ss}` : `${mm}:${ss}`;
  }

  function renderBackgroundPlaylists(state) {
    const container = document.getElementById('bg-playlists');
    const playlists = state.backgroundPlaylists || [];
    const activeId = state.activeBackgroundPlaylistId || 0;
    if (playlists.length === 0) {
      container.innerHTML = '<div id="bg-empty">Жодного плейлиста не додано.</div>';
      return;
    }
    container.innerHTML = '';
    playlists.forEach((p) => {
      const isActive = p.id === activeId;
      const isPlayingHere = isActive && state.current && state.current.backgroundPlaylistId === p.id;
      const showingPause = isPlayingHere && !state.paused;
      const trackCount = (p.tracks || []).length;
      const titleLine = isPlayingHere
        ? `${escapeHtml(p.title || 'Плейлист')} - ${state.current.backgroundTrackIndex}/${state.current.backgroundTrackTotal}`
        : escapeHtml(p.title || 'Плейлист');

      const row = document.createElement('div');
      row.className = 'bg-playlist-item' + (isActive ? ' active' : '');
      row.innerHTML = `
        <div class="bg-playlist-text">
          <div class="bg-playlist-title">${titleLine}</div>
          ${!isPlayingHere ? `<div class="bg-playlist-meta">${trackCount} треків · ${formatDuration(p.totalDuration)}</div>` : ''}
        </div>
        <div class="bg-playlist-controls">
          <button type="button" class="bg-ctrl-btn" data-action="bg-play-toggle" data-id="${p.id}" title="${showingPause ? 'Пауза' : 'Відтворити'}">
            <svg viewBox="0 0 24 24">${showingPause ? PAUSE_ICON : PLAY_ICON}</svg>
          </button>
          <button type="button" class="bg-ctrl-btn${p.shuffle ? ' on' : ''}" data-action="bg-shuffle" data-id="${p.id}" title="Перемішати">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${SHUFFLE_ICON}</svg>
          </button>
          <button type="button" class="bg-ctrl-btn${p.loop ? ' on' : ''}" data-action="bg-loop" data-id="${p.id}" title="Зациклити">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${LOOP_ICON}</svg>
          </button>
          <button type="button" class="bg-ctrl-btn danger" data-action="bg-remove" data-id="${p.id}" title="Видалити">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${REMOVE_ICON}</svg>
          </button>
        </div>`;
      container.appendChild(row);
    });
  }

  function renderProgress(position, duration) {
    lastDuration = duration || 0;
    document.getElementById('time-label').textContent = formatTime(position) + ' / ' + formatTime(duration);
    if (!isSeeking) {
      const slider = document.getElementById('progress-slider');
      const pct = duration > 0 ? Math.min(1000, (position / duration) * 1000) : 0;
      slider.value = pct;
    }
    if (duration > 0 && progressReceivedForKey !== currentKnownKey) {
      progressReceivedForKey = currentKnownKey;
      document.getElementById('platform-icon-wrap').classList.remove('loading');
    }
  }

  function renderBanGroup(elId, values, type) {
    const el = document.getElementById(elId);
    el.innerHTML = values.length
      ? values.map((v) => `<span class="ban-chip">${escapeHtml(v)}<button data-action="unban" data-type="${type}" data-value="${escapeHtml(v)}">✕</button></span>`).join('')
      : '<span style="color:#6b7178">немає</span>';
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Renders the small chip row under a queue item: subscriber tier, a lightning
  // bolt for the priority-redemption reward, or the Donatello amount for
  // donation-boosted tracks. Mirrors the priorityLevel scheme from Music-Handle.cs —
  // level 8 is a donation, everything else is subTier (0-3) plus +4 if it was the
  // priority redemption (level 0 / plain follower gets no chip, nothing to call out).
  function priorityBadgesHtml(t) {
    const level = typeof t.priorityLevel === 'number' ? t.priorityLevel : 0;
    if (level === PRIORITY_LEVEL_DONATION) {
      const amount = Math.round(Number(t.prioritySecondary) || 0);
      return `<span class="badge badge-donation"><img class="badge-icon" src="${DONATELLO_ICON_URL}" alt="">${amount}\u20b4</span>`;
    }
    const isPriority = level >= 4;
    const subTier = isPriority ? level - 4 : level;
    const chips = [];
    if (subTier > 0) chips.push(`<span class="badge badge-sub">Тір ${subTier}</span>`);
    if (isPriority) chips.push(`<span class="badge badge-priority">⚡ Пріоритет</span>`);
    return chips.join('');
  }

  function closeAllMenus() {
    document.querySelectorAll('.item-menu.open').forEach((m) => m.classList.remove('open'));
  }

  document.getElementById('playpause').addEventListener('click', () => {
    doAction({ cmd: lastPaused ? 'resume' : 'pause' });
  });
  document.getElementById('skip-btn').addEventListener('click', () => doAction({ cmd: 'skip' }));

  const slider = document.getElementById('progress-slider');
  const beginSeek = () => { isSeeking = true; };
  slider.addEventListener('mousedown', beginSeek);
  slider.addEventListener('touchstart', beginSeek);
  slider.addEventListener('change', () => {
    const fraction = Number(slider.value) / 1000;
    const targetPosition = fraction * lastDuration;
    doAction({ cmd: 'seek', position: targetPosition });
    // keep ignoring incoming progress updates a little longer, so a stale one
    // doesn't snap the slider back before the new position is confirmed
    setTimeout(() => { isSeeking = false; }, 500);
  });

  document.body.addEventListener('click', (e) => {
    // quick-ban buttons next to the current track
    const quickBan = e.target.closest('.quick-ban-btn');
    if (quickBan) {
      if (quickBan.disabled || !currentTrack) return;
      let banType, value;
      if (quickBan.id === 'qb-song') { banType = 'song'; value = currentTrack.title; }
      else if (quickBan.id === 'qb-artist') { banType = 'artist'; value = currentTrack.artist; }
      else if (quickBan.id === 'qb-user') { banType = 'user'; value = currentTrack.requestedBy; }
      if (value) doAction({ cmd: 'ban', banType, value });
      return;
    }

    // toggle a queue-item's context menu
    const kebab = e.target.closest('.kebab-btn');
    if (kebab) {
      e.stopPropagation();
      const menu = kebab.parentElement.querySelector('.item-menu');
      const wasOpen = menu.classList.contains('open');
      closeAllMenus();
      if (!wasOpen) menu.classList.add('open');
      return;
    }

    // an action picked inside a context menu
    const menuBtn = e.target.closest('.item-menu button[data-action]');
    if (menuBtn) {
      const action = menuBtn.dataset.action;
      if (action === 'play-now') doAction({ cmd: 'playNow', url: menuBtn.dataset.url });
      else if (action === 'remove') doAction({ cmd: 'remove', url: menuBtn.dataset.url });
      else if (action === 'ban-link') doAction({ cmd: 'ban', banType: 'link', value: menuBtn.dataset.url });
      else if (action === 'ban-user') doAction({ cmd: 'ban', banType: 'user', value: menuBtn.dataset.value });
      closeAllMenus();
      return;
    }

    // background playlist controls
    const bgBtn = e.target.closest('.bg-ctrl-btn[data-action]');
    if (bgBtn) {
      const id = Number(bgBtn.dataset.id);
      const action = bgBtn.dataset.action;
      if (action === 'bg-play-toggle') {
        const isPlayingHere = currentTrack && currentTrack.backgroundPlaylistId === id;
        if (isPlayingHere) doAction({ cmd: lastPaused ? 'resume' : 'pause' });
        else doAction({ cmd: 'setActiveBackgroundPlaylist', playlistId: id });
      }
      else if (action === 'bg-shuffle') doAction({ cmd: 'toggleBackgroundPlaylistShuffle', playlistId: id });
      else if (action === 'bg-loop') doAction({ cmd: 'toggleBackgroundPlaylistLoop', playlistId: id });
      else if (action === 'bg-remove') doAction({ cmd: 'removeBackgroundPlaylist', playlistId: id });
      return;
    }

    // unban chip in the Бан-листи panel
    const unbanBtn = e.target.closest('button[data-action="unban"]');
    if (unbanBtn) {
      doAction({ cmd: 'unban', banType: unbanBtn.dataset.type, value: unbanBtn.dataset.value });
      return;
    }

    // click anywhere else closes any open menu
    closeAllMenus();
  });

  document.getElementById('add-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;
    doAction({ cmd: 'addNext', url: form.url.value.trim(), requestedBy: form.requestedBy.value.trim() });
    form.url.value = '';
  });

  document.getElementById('bg-playlist-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;
    const url = form.url.value.trim();
    if (!url) return;
    doAction({ cmd: 'addBackgroundPlaylist', url });
    form.url.value = '';
  });

  connect();
</script>
</body>
</html>
