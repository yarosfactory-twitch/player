<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Синхронний Video + Audio плеєр (Video.js)</title>
  
  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
  
  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a22;
      --border: #2e2e3a;
      --accent: #3b82f6;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .subtitle {
      color: var(--muted);
      text-align: center;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: var(--muted);
    }

    input[type="url"] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      background: #121218;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .buttons {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1.25rem;
    }

    button {
      padding: 0.7rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-secondary {
      background: #2a2a36;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #353545;
    }

    .player-wrapper {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }

    .video-js {
      width: 100% !important;
      height: 100% !important;
    }

    .status {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: var(--muted);
      text-align: center;
      min-height: 1.4em;
    }

    .status.error {
      color: #f87171;
    }

    .status.success {
      color: #4ade80;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Синхронний Video + Audio</h1>
    <p class="subtitle">Встав посилання на відео- та аудіо-потоки — вони будуть відтворюватися синхронно</p>

    <div class="card">
      <div class="field">
        <label for="videoUrl">Посилання на відео-потік</label>
        <input type="url" id="videoUrl" placeholder="https://example.com/video.m3u8 або .mp4" />
      </div>

      <div class="field">
        <label for="audioUrl">Посилання на аудіо-потік</label>
        <input type="url" id="audioUrl" placeholder="https://example.com/audio.m3u8 або .mp3 / .aac" />
      </div>

      <div class="buttons">
        <button class="btn-primary" id="loadBtn">Завантажити і грати</button>
        <button class="btn-secondary" id="stopBtn">Зупинити</button>
      </div>
    </div>

    <div class="player-wrapper">
      <video
        id="videoPlayer"
        class="video-js vjs-big-play-centered"
        controls
        preload="auto"
        playsinline
      ></video>
    </div>

    <!-- Окремий аудіо-елемент (прихований) -->
    <audio id="audioPlayer" preload="auto"></audio>

    <div class="status" id="status"></div>
  </div>

  <footer>
    Video.js + синхронізація аудіо/відео потоків
  </footer>

  <!-- Video.js -->
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>

  <script>
    const videoEl = document.getElementById('videoPlayer');
    const audioEl = document.getElementById('audioPlayer');
    const videoUrlInput = document.getElementById('videoUrl');
    const audioUrlInput = document.getElementById('audioUrl');
    const loadBtn = document.getElementById('loadBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusEl = document.getElementById('status');

    // Ініціалізація Video.js
    const player = videojs('videoPlayer', {
      controls: true,
      autoplay: false,
      preload: 'auto',
      fluid: true,
      responsive: true
    });

    let isSyncing = false;          // щоб уникнути рекурсії
    let syncInterval = null;

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function loadSources() {
      const videoSrc = videoUrlInput.value.trim();
      const audioSrc = audioUrlInput.value.trim();

      if (!videoSrc) {
        setStatus('Вкажи посилання на відео', 'error');
        return;
      }

      // Очищаємо попереднє
      stopPlayback();

      // Встановлюємо джерела
      player.src({ src: videoSrc, type: guessType(videoSrc) });
      
      if (audioSrc) {
        audioEl.src = audioSrc;
        audioEl.load();
      } else {
        audioEl.removeAttribute('src');
      }

      setStatus('Завантаження...', '');

      // Коли відео готове — запускаємо
      player.one('loadeddata', () => {
        setStatus('Готово. Натисни Play', 'success');
        // Якщо хочеш автоматичний старт — розкоментуй:
        // player.play().catch(e => console.warn(e));
      });

      player.one('error', () => {
        setStatus('Помилка завантаження відео', 'error');
      });
    }

    function guessType(url) {
      if (url.includes('.m3u8')) return 'application/x-mpegURL';
      if (url.includes('.mpd')) return 'application/dash+xml';
      if (url.includes('.mp4')) return 'video/mp4';
      if (url.includes('.webm')) return 'video/webm';
      return 'application/x-mpegURL'; // за замовчуванням HLS
    }

    function startSync() {
      if (syncInterval) return;

      // Періодична перевірка дрейфу (кожні 250 мс)
      syncInterval = setInterval(() => {
        if (!audioEl.src || audioEl.paused || player.paused()) return;

        const drift = Math.abs(player.currentTime() - audioEl.currentTime);
        if (drift > 0.25) { // якщо розійшлися більше ніж на 250 мс
          isSyncing = true;
          audioEl.currentTime = player.currentTime();
          isSyncing = false;
        }
      }, 250);
    }

    function stopSync() {
      if (syncInterval) {
        clearInterval(syncInterval);
        syncInterval = null;
      }
    }

    function stopPlayback() {
      player.pause();
      audioEl.pause();
      stopSync();
      player.currentTime(0);
      audioEl.currentTime = 0;
      setStatus('');
    }

    // ===== Синхронізація подій =====

    // Play
    player.on('play', () => {
      if (audioEl.src) {
        audioEl.play().catch(e => console.warn('Audio play error:', e));
        startSync();
      }
    });

    // Pause
    player.on('pause', () => {
      audioEl.pause();
      stopSync();
    });

    // Seeking / Seeked
    player.on('seeking', () => {
      if (audioEl.src && !isSyncing) {
        isSyncing = true;
        audioEl.currentTime = player.currentTime();
        isSyncing = false;
      }
    });

    // Rate change
    player.on('ratechange', () => {
      if (audioEl.src) {
        audioEl.playbackRate = player.playbackRate();
      }
    });

    // Volume (опціонально — можна синхронізувати гучність)
    player.on('volumechange', () => {
      // audioEl.volume = player.volume();
      // audioEl.muted = player.muted();
    });

    // Коли відео закінчилось
    player.on('ended', () => {
      audioEl.pause();
      stopSync();
    });

    // Кнопки
    loadBtn.addEventListener('click', loadSources);
    stopBtn.addEventListener('click', stopPlayback);

    // Enter у полях
    videoUrlInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') loadSources();
    });
    audioUrlInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') loadSources();
    });
  </script>
</body>
</html>
